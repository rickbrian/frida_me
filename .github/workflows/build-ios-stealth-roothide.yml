name: Build iOS Stealth Frida (roothide)

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida version tag (leave empty for latest)"
        required: false
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-ios-stealth-roothide.yml"
      - "scripts/**"

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # ── Resolve version ──
      - name: Get Frida version
        id: frida
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.frida_version }}" ]; then
            VER="${{ github.event.inputs.frida_version }}"
          else
            VER=$(curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/frida/frida/releases/latest \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tag_name', ''))")
            if [ -z "$VER" ]; then
              echo "::error::Failed to get Frida version from API"
              exit 1
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Frida version: $VER"

      # ── Skip if already released (push only) ──
      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.frida.outputs.version }}-ios-stealth-roothide"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # ── Delete old release on re-trigger ──
      - name: Delete existing release if re-trigger
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.frida.outputs.version }}-ios-stealth-roothide"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
          if [ "$CODE" = "200" ]; then
            echo "Deleting old release..."
            RELEASE_ID=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            curl -s -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            git push --delete origin "${TAG}" || true
          fi

      # ── Clone Frida ──
      - name: Clone Frida source
        if: steps.check.outputs.skip != 'true'
        env:
          FRIDA_VERSION: ${{ steps.frida.outputs.version }}
        run: |
          git clone https://github.com/frida/frida frida-build \
            --branch "$FRIDA_VERSION" --depth 1
          cd frida-build
          git submodule update --init --depth 1 \
            subprojects/frida-gum \
            subprojects/frida-core \
            releng

      # ── Apply source-level stealth patches ──
      - name: Apply stealth patches
        if: steps.check.outputs.skip != 'true'
        run: bash scripts/apply-ios-stealth.sh frida-build

      # ── Configure + Build (arm64e: server + gadget + devkit) ──
      - name: Configure (arm64e)
        if: steps.check.outputs.skip != 'true'
        working-directory: frida-build
        env:
          IOS_CERTID: "-"
          MACOS_CERTID: "-"
        run: |
          ./configure \
            --prefix=/usr \
            --host=ios-arm64e \
            --enable-server \
            --enable-gadget \
            -- \
            -Dfrida-core:assets=installed \
            -Dfrida-core:compiler_backend=disabled \
            -Dfrida-gum:devkits=gum,gumjs \
            -Db_lto=true \
            -Doptimization=s \
            -Dstrip=true

      - name: Build (arm64e)
        if: steps.check.outputs.skip != 'true'
        working-directory: frida-build
        env:
          IOS_CERTID: "-"
          MACOS_CERTID: "-"
        run: make -j$(sysctl -n hw.ncpu)

      - name: Install to staging
        if: steps.check.outputs.skip != 'true'
        working-directory: frida-build
        env:
          IOS_CERTID: "-"
          MACOS_CERTID: "-"
        run: DESTDIR="$PWD/dist" make install

      # ── Extract arm64e devkit from build tree ──
      - name: Extract arm64e devkit
        if: steps.check.outputs.skip != 'true'
        run: |
          for KIT in gumjs gum; do
            DIR="devkit-arm64e/${KIT}"
            mkdir -p "$DIR"

            DEVKIT_DIR=$(find frida-build/build -type d -path "*/${KIT}/devkit" 2>/dev/null | head -1)
            if [ -n "$DEVKIT_DIR" ]; then
              echo "${KIT} devkit dir: ${DEVKIT_DIR}"
              ls -la "$DEVKIT_DIR"/
              cp "$DEVKIT_DIR"/* "$DIR/" 2>/dev/null || true
              if [ -f "$DIR/libfrida-${KIT}.a" ] && [ ! -f "$DIR/frida-${KIT}.a" ]; then
                mv "$DIR/libfrida-${KIT}.a" "$DIR/frida-${KIT}.a"
              fi
            fi

            if [ -f "$DIR/frida-${KIT}.a" ]; then
              echo "[+] arm64e ${KIT}: $(du -h "$DIR/frida-${KIT}.a" | cut -f1)"
            else
              echo "::warning::arm64e ${KIT} .a not found in devkit dir"
            fi
          done

      # ── Build arm64 devkit (separate pass) ──
      - name: Configure (arm64 devkit)
        if: steps.check.outputs.skip != 'true'
        working-directory: frida-build
        env:
          IOS_CERTID: "-"
          MACOS_CERTID: "-"
        run: |
          rm -rf build
          ./configure \
            --host=ios-arm64 \
            -- \
            -Dfrida-core:assets=installed \
            -Dfrida-core:compiler_backend=disabled \
            -Dfrida-gum:devkits=gum,gumjs \
            -Doptimization=s

      - name: Build (arm64 devkit)
        if: steps.check.outputs.skip != 'true'
        working-directory: frida-build
        env:
          IOS_CERTID: "-"
          MACOS_CERTID: "-"
        run: make -j$(sysctl -n hw.ncpu)

      - name: Extract arm64 devkit
        if: steps.check.outputs.skip != 'true'
        run: |
          for KIT in gumjs gum; do
            DIR="devkit-arm64/${KIT}"
            mkdir -p "$DIR"

            DEVKIT_DIR=$(find frida-build/build -type d -path "*/${KIT}/devkit" 2>/dev/null | head -1)
            if [ -n "$DEVKIT_DIR" ]; then
              echo "${KIT} devkit dir: ${DEVKIT_DIR}"
              ls -la "$DEVKIT_DIR"/
              cp "$DEVKIT_DIR"/* "$DIR/" 2>/dev/null || true
              if [ -f "$DIR/libfrida-${KIT}.a" ] && [ ! -f "$DIR/frida-${KIT}.a" ]; then
                mv "$DIR/libfrida-${KIT}.a" "$DIR/frida-${KIT}.a"
              fi
            fi

            if [ -f "$DIR/frida-${KIT}.a" ]; then
              echo "[+] arm64 ${KIT}: $(du -h "$DIR/frida-${KIT}.a" | cut -f1)"
            else
              echo "::warning::arm64 ${KIT} .a not found in devkit dir"
            fi
          done

      # ── Post-build binary patching ──
      - name: Patch binaries
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 scripts/anti-anti-frida-macho.py \
            frida-build/dist/usr/bin/frida-server \
            frida-build/dist/usr/lib/frida-1.0/frida-agent.dylib

          if [ -f "frida-build/dist/usr/lib/frida-1.0/frida-helper" ]; then
            python3 scripts/anti-anti-frida-macho.py \
              frida-build/dist/usr/lib/frida-1.0/frida-helper
          fi

          GADGET=$(find frida-build/dist -name 'frida-gadget.dylib' -o -name 'FridaGadget.dylib' 2>/dev/null | head -1)
          if [ -n "$GADGET" ]; then
            python3 scripts/anti-anti-frida-macho.py "$GADGET"
          fi

          echo ""
          echo "=== Patching devkit static libraries ==="
          for arch in arm64e arm64; do
            for kit in gumjs gum; do
              LIB="devkit-${arch}/${kit}/frida-${kit}.a"
              if [ -f "$LIB" ]; then
                python3 scripts/anti-anti-frida-macho.py "$LIB"
              fi
            done
          done

      # ── Strip symbols ──
      - name: Strip binaries
        if: steps.check.outputs.skip != 'true'
        run: |
          strip frida-build/dist/usr/bin/frida-server 2>/dev/null || true
          if [ -f "frida-build/dist/usr/lib/frida-1.0/frida-helper" ]; then
            strip frida-build/dist/usr/lib/frida-1.0/frida-helper 2>/dev/null || true
          fi

          strip -x frida-build/dist/usr/lib/frida-1.0/frida-agent.dylib 2>/dev/null || true
          GADGET=$(find frida-build/dist -name 'frida-gadget.dylib' -o -name 'FridaGadget.dylib' 2>/dev/null | head -1)
          if [ -n "$GADGET" ]; then
            strip -x "$GADGET" 2>/dev/null || true
          fi

          for arch in arm64e arm64; do
            for kit in gumjs gum; do
              LIB="devkit-${arch}/${kit}/frida-${kit}.a"
              if [ -f "$LIB" ]; then
                BEFORE=$(du -h "$LIB" | cut -f1)
                strip -S "$LIB" 2>/dev/null || true
                AFTER=$(du -h "$LIB" | cut -f1)
                echo "strip -S ${arch}/${kit}: ${BEFORE} -> ${AFTER}"
              fi
            done
          done

      # ── Install ldid ──
      - name: Install ldid
        if: steps.check.outputs.skip != 'true'
        run: brew install ldid

      # ── Re-sign with ldid (jailbreak-compatible) ──
      - name: Create entitlements and re-sign with ldid
        if: steps.check.outputs.skip != 'true'
        run: |
          cat > ent.plist << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>platform-application</key> <true/>
            <key>com.apple.private.security.no-sandbox</key> <true/>
            <key>com.apple.private.security.storage.AppBundles</key> <true/>
            <key>com.apple.private.security.storage.AppDataContainers</key> <true/>
            <key>com.apple.private.cs.debugger</key> <true/>
            <key>com.apple.private.thread-set-state</key> <true/>
            <key>com.apple.private.skip-library-validation</key> <true/>
            <key>com.apple.private.amfi.can-load-cdhash</key> <true/>
            <key>com.apple.private.amfi.can-execute-cdhash</key> <true/>
            <key>dynamic-codesigning</key> <true/>
            <key>run-unsigned-code</key> <true/>
            <key>get-task-allow</key> <true/>
            <key>task_for_pid-allow</key> <true/>
            <key>com.apple.springboard.debugapplications</key> <true/>
            <key>com.apple.backboardd.debugapplications</key> <true/>
            <key>com.apple.backboardd.launchapplications</key> <true/>
            <key>com.apple.frontboard.debugapplications</key> <true/>
            <key>com.apple.frontboard.launchapplications</key> <true/>
            <key>com.apple.security.network.client</key> <true/>
            <key>com.apple.security.network.server</key> <true/>
          </dict>
          </plist>
          ENTEOF

          ldid -Sent.plist frida-build/dist/usr/bin/frida-server
          echo "[+] Server signed with ldid"
          ldid -e frida-build/dist/usr/bin/frida-server | head -5

          ldid -S frida-build/dist/usr/lib/frida-1.0/frida-agent.dylib
          echo "[+] Agent signed with ldid"

          GADGET=$(find frida-build/dist -name 'frida-gadget.dylib' -o -name 'FridaGadget.dylib' 2>/dev/null | head -1)
          if [ -n "$GADGET" ]; then
            ldid -S "$GADGET"
            echo "[+] Gadget signed with ldid"
          fi

          if [ -f "frida-build/dist/usr/lib/frida-1.0/frida-helper" ]; then
            ldid -Sent.plist frida-build/dist/usr/lib/frida-1.0/frida-helper
            echo "[+] Helper signed with ldid"
          fi

      # ── Install dpkg (macOS doesn't have it) ──
      - name: Install dpkg
        if: steps.check.outputs.skip != 'true'
        run: brew install dpkg

      # ── Package (roothide native format) ──
      - name: Package release assets (roothide)
        if: steps.check.outputs.skip != 'true'
        env:
          FRIDA_VERSION: ${{ steps.frida.outputs.version }}
        run: |
          mkdir -p release

          # 单独的二进制文件（与 rootless 版相同产物名）
          cp frida-build/dist/usr/bin/frida-server release/fs17910
          cp frida-build/dist/usr/lib/frida-1.0/frida-agent.dylib release/fs17910d.dylib
          if [ -f "frida-build/dist/usr/lib/frida-1.0/frida-helper" ]; then
            cp frida-build/dist/usr/lib/frida-1.0/frida-helper release/fs17910h
          fi

          GADGET=$(find frida-build/dist -name 'frida-gadget.dylib' -o -name 'FridaGadget.dylib' 2>/dev/null | head -1)
          if [ -n "$GADGET" ]; then
            cp "$GADGET" release/fs17910-gadget.dylib
          fi

          # ══════════════════════════════════════════
          # roothide native .deb
          # 路径不带 /var/jb/ 前缀，dpkg 安装到 jbroot
          # ══════════════════════════════════════════
          DEB_ROOT="deb-build"
          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/usr/sbin"
          mkdir -p "$DEB_ROOT/usr/lib/fs179-1.0"

          cp frida-build/dist/usr/bin/frida-server "$DEB_ROOT/usr/sbin/fs17910"
          cp frida-build/dist/usr/lib/frida-1.0/frida-agent.dylib "$DEB_ROOT/usr/lib/fs179-1.0/fs179-agent.dylib"
          if [ -f "frida-build/dist/usr/lib/frida-1.0/frida-helper" ]; then
            cp frida-build/dist/usr/lib/frida-1.0/frida-helper "$DEB_ROOT/usr/lib/fs179-1.0/fs179-helper"
            chmod 0755 "$DEB_ROOT/usr/lib/fs179-1.0/fs179-helper"
          fi
          chmod 0755 "$DEB_ROOT/usr/sbin/fs17910"

          # LaunchDaemon plist — 直接打包在 deb 里，dpkg 安装到 jbroot
          mkdir -p "$DEB_ROOT/Library/LaunchDaemons"
          cat > "$DEB_ROOT/Library/LaunchDaemons/com.local.fs17910.plist" << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key>
            <string>com.local.fs17910</string>
            <key>Program</key>
            <string>/usr/sbin/fs17910</string>
            <key>ProgramArguments</key>
            <array>
              <string>/usr/sbin/fs17910</string>
            </array>
            <key>RunAtLoad</key>
            <true/>
            <key>KeepAlive</key>
            <true/>
            <key>ThrottleInterval</key>
            <integer>30</integer>
            <key>UserName</key>
            <string>root</string>
          </dict>
          </plist>
          PLISTEOF
          sed -i '' 's/^          //' "$DEB_ROOT/Library/LaunchDaemons/com.local.fs17910.plist"

          # postinst — 加载 daemon
          cat > "$DEB_ROOT/DEBIAN/postinst" << 'POSTEOF'
          #!/bin/bash
          chown root:wheel /Library/LaunchDaemons/com.local.fs17910.plist
          chmod 644 /Library/LaunchDaemons/com.local.fs17910.plist
          launchctl unload /Library/LaunchDaemons/com.local.fs17910.plist 2>/dev/null || true
          launchctl load /Library/LaunchDaemons/com.local.fs17910.plist 2>/dev/null || true
          # Fallback: start directly if launchctl not supported
          if ! pgrep -x fs17910 >/dev/null 2>&1; then
            nohup /usr/sbin/fs17910 >/dev/null 2>&1 &
          fi
          POSTEOF
          sed -i '' 's/^          //' "$DEB_ROOT/DEBIAN/postinst"
          chmod 0755 "$DEB_ROOT/DEBIAN/postinst"

          # prerm — 卸载前停止 daemon
          cat > "$DEB_ROOT/DEBIAN/prerm" << 'PRERMEOF'
          #!/bin/bash
          launchctl unload /Library/LaunchDaemons/com.local.fs17910.plist 2>/dev/null || true
          killall fs17910 2>/dev/null || true
          exit 0
          PRERMEOF
          sed -i '' 's/^          //' "$DEB_ROOT/DEBIAN/prerm"
          chmod 0755 "$DEB_ROOT/DEBIAN/prerm"

          cat > "$DEB_ROOT/DEBIAN/control" << CTRLEOF
          Package: com.local.fs17910.rh
          Name: fs17910 (rh)
          Version: ${FRIDA_VERSION}
          Architecture: iphoneos-arm64e
          Description: system service daemon
          Maintainer: local
          Section: System
          Conflicts: com.local.fs17910
          CTRLEOF
          sed -i '' 's/^          //' "$DEB_ROOT/DEBIAN/control"

          dpkg-deb -b -Zxz "$DEB_ROOT" "release/fs17910_${FRIDA_VERSION}_iphoneos-arm64e_roothide.deb"

          # ── Devkit tar.xz 打包 ──
          for arch in arm64e arm64; do
            for kit in gumjs gum; do
              DIR="devkit-${arch}/${kit}"
              if [ -f "${DIR}/frida-${kit}.a" ]; then
                TARNAME="stealth-frida-${kit}-devkit-${FRIDA_VERSION}-ios-${arch}.tar.xz"
                tar -cJf "release/${TARNAME}" -C "${DIR}" .
                echo "Packed: ${TARNAME} ($(du -h "release/${TARNAME}" | cut -f1))"
              fi
            done
          done

      # ── Upload + Release ──
      - name: Upload build artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fs17910-ios-stealth-roothide
          path: release/*

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.frida.outputs.version }}-ios-stealth-roothide"
          name: "Stealth Frida ${{ steps.frida.outputs.version }} for iOS (roothide)"
          prerelease: false
          files: |
            release/fs17910
            release/fs17910d.dylib
            release/fs17910h
            release/fs17910-gadget.dylib
            release/*_roothide.deb
            release/stealth-frida-gumjs-devkit-*.tar.xz
            release/stealth-frida-gum-devkit-*.tar.xz
          body: |
            ## iOS Stealth Frida ${{ steps.frida.outputs.version }} (roothide native)

            适用于 **roothide Bootstrap / Palera1n-roothide** 的原生格式包。
            无需 `rootless-compat`，直接通过 Sileo/Zebra 安装。

            ### 与 rootless 版的区别

            | | rootless (Dopamine) | roothide (本包) |
            |---|---|---|
            | 安装路径前缀 | `/var/jb/` | jbroot (随机) |
            | 依赖 | 无 | 无 (原生格式) |
            | LaunchDaemon | 静态路径 plist | postinst 动态生成 |
            | 包管理器 | Sileo/Zebra | Sileo/Zebra (roothide) |

            ### 产物说明

            #### 一、Server
            | 文件 | 说明 |
            |---|---|
            | `fs17910` | stealth server (arm64e) |
            | `fs17910d.dylib` | stealth agent |
            | `fs17910h` | helper |
            | `fs17910-gadget.dylib` | stealth Gadget |
            | `fs17910_*_roothide.deb` | roothide 原生安装包 |

            #### 二、GumJS Devkit
            | 文件 | 说明 |
            |---|---|
            | `stealth-frida-gumjs-devkit-*-ios-arm64e.tar.xz` | A12+ (iPhone XS+) |
            | `stealth-frida-gumjs-devkit-*-ios-arm64.tar.xz` | A8–A11 (iPhone 6s~X) |
            | `stealth-frida-gum-devkit-*-ios-arm64e.tar.xz` | C-only API (arm64e) |
            | `stealth-frida-gum-devkit-*-ios-arm64.tar.xz` | C-only API (arm64) |

            ### 安装

            ```bash
            # 方式一：通过 Sileo/Zebra 导入 .deb 安装（推荐）
            # 方式二：命令行
            dpkg -i fs17910_*_roothide.deb
            ```

            ### 卸载

            ```bash
            dpkg -r com.local.fs17910.rh
            ```

            ### 电脑端连接

            ```bash
            frida -U -f com.target.app -l script.js
            frida -H DEVICE_IP:8899 -f com.target.app -l script.js
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Push deb to Sileo repo ──
      - name: Push deb to Sileo repo
        if: steps.check.outputs.skip != 'true'
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          FRIDA_VERSION: ${{ steps.frida.outputs.version }}
        run: |
          git clone https://x-access-token:${REPO_TOKEN}@github.com/rickbrian/repo.git /tmp/repo
          cd /tmp/repo
          rm -f debs/fs17910_*_roothide.deb debs/fs17910_*_iphoneos-arm64e_roothide.deb
          cp "$GITHUB_WORKSPACE/release/"*_roothide.deb debs/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update fs17910 roothide ${FRIDA_VERSION}" || echo "No changes"
          git pull --rebase || true
          git push
